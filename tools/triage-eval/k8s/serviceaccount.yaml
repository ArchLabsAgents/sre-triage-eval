# ServiceAccount the sslm-agent Deployment runs as. The governance claim rests on this
# ServiceAccount, not on our own promise: it is what an operator's security team audits (`kubectl auth can-i --list --as=system:serviceaccount:sslm-agent:sslm-agent`).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sslm-agent
  namespace: sslm-agent
